<form class="auth-card" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
  <h1>Créer un compte</h1>

  <div class="form-field">
    <label for="register-email">Email</label>
    <input id="register-email" type="email" formControlName="email" autocomplete="email"
           placeholder="Saisissez votre email..." [class.invalid]="isInvalid('email')" />
    @if (isInvalid('email')) {
      <span class="field-error" id="register-email-error">Veuillez saisir un email valide.</span>
    }
  </div>

  <div class="form-field">
    <label for="register-password">Mot de passe</label>
    <input id="register-password" type="password" formControlName="password" autocomplete="new-password"
           placeholder="Saisissez votre mot de passe..." [class.invalid]="isInvalid('password')" />
    @if (isInvalid('password')) {
      <span class="field-error" id="register-password-error">Le mot de passe doit contenir au moins 8 caractères.</span>
    }
  </div>

  <div class="form-field">
    <label for="register-confirm">Verification du mot de passe</label>
    <input id="register-confirm" type="password" formControlName="confirmPassword" autocomplete="new-password"
           placeholder="Saisissez le à nouveau"
           [class.invalid]="isInvalid('confirmPassword') || passwordMismatch" />
    @if (passwordMismatch) {
      <span class="field-error" id="register-confirm-error">Les mots de passe ne correspondent pas.</span>
    }
  </div>

  <a class="auth-switch" routerLink="/login">J'ai déjà un compte</a>

  @if (errorMessage()) {
    <p class="form-error" role="alert">{{ errorMessage() }}</p>
  }

  <button type="submit" class="btn-primary" [disabled]="loading()">Créer mon compte</button>
</form>
