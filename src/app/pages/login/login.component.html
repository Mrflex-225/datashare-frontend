<form class="auth-card" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
  <h1>Connexion</h1>

  <div class="form-field">
    <label for="login-email">Email</label>
    <input id="login-email" type="email" formControlName="email" autocomplete="email"
           placeholder="Saisissez votre email..." [class.invalid]="isInvalid('email')" />
    @if (isInvalid('email')) {
      <span class="field-error" id="login-email-error">Veuillez saisir un email valide.</span>
    }
  </div>

  <div class="form-field">
    <label for="login-password">Mot de passe</label>
    <input id="login-password" type="password" formControlName="password" autocomplete="current-password"
           placeholder="Saisissez votre mot de passe..." [class.invalid]="isInvalid('password')" />
    @if (isInvalid('password')) {
      <span class="field-error" id="login-password-error">Le mot de passe doit contenir au moins 8 caractères.</span>
    }
  </div>

  <a class="auth-switch" routerLink="/register">Créer un compte</a>

  @if (errorMessage()) {
    <p class="form-error" role="alert">{{ errorMessage() }}</p>
  }

  <button type="submit" class="btn-primary" [disabled]="loading()">Connexion</button>
</form>
